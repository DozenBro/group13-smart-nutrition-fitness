name: Build and test

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: fitness
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: fitness_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitness -d fitness_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://fitness:ci-test-password@127.0.0.1:5432/fitness_test
      TEST_DATABASE_URL: postgresql+psycopg://fitness:ci-test-password@127.0.0.1:5432/fitness_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.txt
      - run: python -m alembic upgrade head
      - run: python -m pytest -q tests
      - run: npm install
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
